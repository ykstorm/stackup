# The Service in front of every demo pod, old and new. The Ingress,
# ci/traffic.yaml and the ServiceMonitor use it, so during a canary the
# requests are spread over all ready pods and a weight is a share of pods.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo.fullname" . }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "demo.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- /*
The Rollout's canaryService and stableService. Argo Rollouts adds the
rollouts-pod-template-hash of one ReplicaSet to their selectors: during an
update `-canary` selects only the new pods and `-stable` only the old ones,
and between updates both select the stable pods. No traffic goes through
them; the canary one exists so Prometheus can scrape the canary pods on their
own (templates/servicemonitor.yaml). Their component label differs from the
main Service's, so the main ServiceMonitor does not select them.
*/}}
{{- if .Values.rollout.enabled }}
{{- range $role := list "canary" "stable" }}
---
# The Rollout's {{ $role }}Service; Argo Rollouts manages its selector.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo.fullname" $ }}-{{ $role }}
  labels:
    helm.sh/chart: {{ include "demo.chart" $ }}
    app.kubernetes.io/name: {{ include "demo.name" $ }}
    app.kubernetes.io/component: {{ $role }}
    app.kubernetes.io/version: {{ $.Chart.AppVersion | quote }}
    app.kubernetes.io/part-of: stackup
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  type: ClusterIP
  selector:
    {{- include "demo.selectorLabels" $ | nindent 4 }}
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
