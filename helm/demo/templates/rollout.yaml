{{- if .Values.rollout.enabled }}
# Argo Rollout — the canary equivalent of deployment.yaml. Exactly one of
# Deployment/Rollout renders: this file is gated on .Values.rollout.enabled,
# deployment.yaml on `not .Values.rollout.enabled`. The pod/container spec
# comes from the shared `demo.container` template so the two never drift.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "demo.fullname" . }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    canary:
      # Argo Rollouts points these at the canary and the stable pods
      # (templates/service.yaml). There is no traffic router, so no traffic
      # goes through them: requests still reach every pod through the main
      # Service, and the canary one only tells Prometheus which pods to
      # scrape for the analysis.
      canaryService: {{ include "demo.fullname" . }}-canary
      stableService: {{ include "demo.fullname" . }}-stable
      steps:
        - setWeight: 25
        - pause: { duration: {{ .Values.rollout.canary.pauseDuration }} }
        - analysis:
            templates:
              - templateName: {{ include "demo.fullname" . }}-success-rate
            # The analysis reads only the canary pods: the samples scraped
            # through the canary Service that carry the pod-template-hash of
            # the new ReplicaSet (Latest).
            args:
              - name: canary-service
                value: {{ include "demo.fullname" . }}-canary
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - pause: { duration: {{ .Values.rollout.canary.pauseDuration }} }
        - setWeight: 75
        - pause: { duration: {{ .Values.rollout.canary.pauseDuration }} }
        - setWeight: 100
  selector:
    matchLabels:
      {{- include "demo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demo.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        {{- include "demo.container" . | nindent 8 }}
{{- end }}
