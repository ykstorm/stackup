{{- if .Values.networkPolicy.enabled }}
# Who may connect to the demo pods, and only on their http port:
#   - the ingress-nginx controller, which serves demo.localtest.me;
#   - pods in this namespace, the Service's in-cluster clients;
#   - Prometheus in the monitoring namespace, when the ServiceMonitor is on.
#     Without this rule every scrape is dropped and the target shows down.
# Kubernetes sets the kubernetes.io/metadata.name label on every namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "demo.fullname" . }}-allow-ingress
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "demo.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
        - podSelector: {}
        {{- if .Values.serviceMonitor.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
        {{- end }}
      ports:
        - protocol: TCP
          port: http
{{- end }}
