{{- if .Values.networkPolicy.enabled }}
# Egress that every pod in the namespace still gets under the default deny:
#   - DNS to CoreDNS in kube-system, so service names resolve;
#   - the demo pods' http port, so in-namespace clients such as the traffic
#     generator in ci/traffic.yaml (the README's roll-back walk-through) can
#     reach the Service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "demo.fullname" . }}-allow-egress
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              {{- include "demo.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: http
{{- end }}
