{{- if .Values.ingress.enabled }}
# https://demo.localtest.me through ingress-nginx. cert-manager sees the
# annotation, issues a certificate from the named ClusterIssuer and stores it
# in the TLS secret, which ingress-nginx then serves.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "demo.fullname" . }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "demo.fullname" . }}
                port:
                  name: http
{{- end }}
