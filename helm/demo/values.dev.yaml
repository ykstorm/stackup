# Overrides for the local kind cluster.
#
# Renders an Argo Rollout (canary) instead of a plain Deployment so the
# documented canary flow — `kubectl argo rollouts get rollout demo -n app`
# — works end to end. Two replicas keep the canary weight steps visible.
# Turns on the NetworkPolicies (Calico enforces them) and the Ingress at
# https://demo.localtest.me, and lowers the resources. It changes no timing:
# the canary uses the defaults in values.yaml.

replicaCount: 2

rollout:
  enabled: true

networkPolicy:
  enabled: true

ingress:
  enabled: true

resources:
  requests:
    cpu: "25m"
    memory: "48Mi"
  limits:
    cpu: "150m"
    memory: "96Mi"
