# Default values for the demo chart (the canary subject).
# values.dev.yaml overrides these for the kind cluster; values.ci.yaml
# layers on top of values.dev.yaml for the CI canary job.

image:
  repository: stackup-demo
  # Built locally and side-loaded into kind (see apps/demo/Dockerfile and
  # the README "Build the demo image into kind" section). Never pulled
  # from a registry, so pullPolicy is IfNotPresent.
  tag: v1
  pullPolicy: IfNotPresent

replicaCount: 2

# The value the demo app stamps onto the `service` label of every
# http_requests_total sample (SERVICE_NAME env). The AnalysisTemplate
# PromQL selects on service="<this>", so the two MUST agree.
serviceName: demo

# Fraction of /api/work requests the app fails (0..1). Changing it
# changes the pod template, so it starts a new canary on its own; set
# it to e.g. "0.5" to ship a bad version without rebuilding the image.
# Only /api/work is affected, so the gate needs real traffic on that
# path to see the failures (see ci/traffic.yaml).
failureRate: "0"

# Progressive delivery. When false (default) the chart renders a plain
# Deployment; when true (values.dev.yaml) it renders an Argo Rollout with
# a canary strategy + AnalysisTemplate and the Deployment is suppressed —
# exactly one workload object exists either way.
rollout:
  enabled: false
  # Canary pause between weight steps: 30s of soak per step by default.
  # The CI e2e overlay (values.ci.yaml) shortens it so the whole rollout
  # fits a runner budget.
  canary:
    pauseDuration: 30s
  analysis:
    # kube-prometheus-stack exposes a stable, release-independent service
    # for the operated Prometheus at this address.
    prometheusAddress: http://prometheus-operated.monitoring.svc:9090
    # rate() window for the success-rate PromQL. 2m by default; the CI
    # overlay shortens it to match a compressed traffic window. Templated so
    # both share one AnalysisTemplate.
    window: 2m
    interval: 30s
    # Bounded step-analysis: run the query `count` times, then conclude.
    # An inline canary-step metric MUST terminate — without `count` Argo
    # Rollouts treats it as indefinite and rejects the whole Rollout spec
    # (InvalidSpec → zero pods). count 3 × interval 30s = the ~90s window.
    count: 3
    initialDelay: 30s
    # successCondition is `result[0] >= successThreshold`.
    successThreshold: "0.95"
    # The metric fails only when failed measurements EXCEED failureLimit,
    # and reaching `count` otherwise marks it Successful. So failureLimit
    # must stay below count or the gate can never abort. 1 with count 3:
    # one bad measurement is tolerated, two abort the rollout.
    failureLimit: 1

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "250m"
    memory: "128Mi"

# Restricted-PSS-compliant security context (matches the `restricted`
# namespace labels). Image runs as UID 1001, drops all caps, read-only
# root filesystem.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 3000

# ServiceMonitor for kube-prometheus-stack to scrape /metrics. The
# operator (release `kps`) sets serviceMonitorSelectorNilUsesHelmValues
# =false so it adopts ServiceMonitors cluster-wide; the release label is
# set anyway as defence-in-depth.
serviceMonitor:
  enabled: true
  path: /metrics
  port: http
  interval: 30s
  scrapeTimeout: 10s
  releaseLabel: kps

# Probes — httpGet against /healthz, which always returns 200.
probes:
  startup:
    failureThreshold: 30
    periodSeconds: 2
    timeoutSeconds: 2
  liveness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
