# Minimal Prometheus for the canary e2e (.github/workflows/canary-e2e.yml).
#
# NOT kube-prometheus-stack — this is a single bare Prometheus that scrapes the
# demo pods directly via endpoints service-discovery. It exposes the same
# service name the AnalysisTemplate targets by default —
# `prometheus-operated.monitoring.svc:9090` — so the Rollout's real success-rate
# query runs against real scraped data with no template change. Kept tiny so the
# e2e fits a runner: 5s scrape, no alerting, no persistence.
#
# It labels the samples the way the kube-prometheus-stack operator does for
# the chart's two ServiceMonitors, because the gate's query depends on it:
# `service` is the Kubernetes Service a pod was scraped through (the app's own
# `service` label clashes and is kept as `exported_service`), and
# `rollouts_pod_template_hash` is the pod's rollouts-pod-template-hash label.
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-ci
rules:
  - apiGroups: [""]
    resources: [nodes, services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-ci
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      scrape_timeout: 4s
    scrape_configs:
      # Scrape the demo pods per-pod (via endpoints), so rate() sees a stable
      # per-target counter. Scraping the Service VIP would round-robin pods and
      # corrupt the counter; endpoints SD avoids that. Two Services: `demo`
      # in front of every pod, and `demo-canary`, which Argo Rollouts points
      # at the canary pods during an update.
      - job_name: demo
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [app]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: demo|demo-canary
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]
            target_label: rollouts_pod_template_hash
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels: { app: prometheus }
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15m
          ports:
            - { name: http, containerPort: 9090 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}
---
# Named `prometheus-operated` to match the AnalysisTemplate's default address,
# so no per-environment override of prometheusAddress is needed.
apiVersion: v1
kind: Service
metadata:
  name: prometheus-operated
  namespace: monitoring
spec:
  selector: { app: prometheus }
  ports:
    - { name: http, port: 9090, targetPort: 9090 }
