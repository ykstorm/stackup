# The `app` workload namespace.
#
# The demo chart installs here (Makefile NAMESPACE=app, and the demo
# Application's destination.namespace). Pod Security Standards
# `restricted` is enforced at the namespace level. That is a cluster
# concern rather than a workload concern, so it lives here instead of in
# the Helm chart.
apiVersion: v1
kind: Namespace
metadata:
  name: app
  labels:
    app.kubernetes.io/part-of: stackup
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
