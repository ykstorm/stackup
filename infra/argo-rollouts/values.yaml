# Argo Rollouts values for the stackup cluster.
#
# Values for the upstream chart are nested under its dependency name
# `argo-rollouts` (see Chart.yaml).
#
# Kept minimal: the controller is all the demo canary needs. The
# `kubectl argo rollouts` plugin runs on the laptop and reads Rollout
# objects directly, so no in-cluster dashboard is installed.

argo-rollouts:
  dashboard:
    enabled: false

  controller:
    # Single replica is enough on a single-node kind cluster.
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
