# Wrapper chart for Argo Rollouts.
#
# The ingress-nginx and kube-prometheus-stack overlays are values-only
# files that the ArgoCD Applications pair with the upstream chart. This
# directory carries a Chart.yaml with a pinned dependency instead, for
# two reasons:
#   1. `helm lint infra/argo-rollouts` runs in CI, and lint needs a
#      Chart.yaml.
#   2. The ArgoCD Application points straight at this directory; a
#      self-contained chart renders without an out-of-band `helm repo add`.
apiVersion: v2
name: argo-rollouts
description: |-
  Argo Rollouts controller for the stackup cluster. Drives the demo
  Rollout through its canary steps and runs its AnalysisTemplate.
type: application
version: 0.1.0
appVersion: "1.9.0"
home: https://github.com/ykstorm/stackup
sources:
  - https://github.com/ykstorm/stackup
maintainers:
  - name: ykstorm
dependencies:
  # Pinned, not floated. Bump deliberately and re-run `helm dependency build`.
  - name: argo-rollouts
    version: 2.41.0
    repository: https://argoproj.github.io/argo-helm
