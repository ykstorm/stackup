# kube-prometheus-stack values for the local kind cluster.
#
# The chart version is pinned in argocd/apps/templates/kube-prometheus-stack.yaml.
# Chart defaults not mentioned here are accepted as-is.

# -----------------------------------------------------------------------
# No alerting: nothing in this stack defines alerts.
# -----------------------------------------------------------------------
alertmanager:
  enabled: false

# -----------------------------------------------------------------------
# Prometheus
# -----------------------------------------------------------------------
prometheus:
  prometheusSpec:
    # Without this the operator only adopts ServiceMonitors carrying this
    # chart's own release label (release=kps), so a ServiceMonitor from
    # another release, such as the demo chart's, would be ignored.
    # false makes the operator adopt any ServiceMonitor cluster-wide.
    serviceMonitorSelectorNilUsesHelmValues: false

    # The same applies to PodMonitors, PrometheusRules and Probes from
    # other charts.
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

    # emptyDir storage: data lives in the pod and is gone after a restart
    # or `make down`. A long-lived install would set a volumeClaimTemplate
    # here, backed by a StorageClass.
    storageSpec: {}

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

    # Default scrape interval (a ServiceMonitor can override it).
    scrapeInterval: 30s

# -----------------------------------------------------------------------
# Grafana
# -----------------------------------------------------------------------
grafana:
  enabled: true

  # The chart's well-known default. Acceptable on a local cluster with no
  # real data; anything shared should use admin.existingSecret pointing at
  # a Secret instead.
  adminPassword: prom-operator

  # Grafana keeps users and settings in SQLite on disk; without persistence
  # that is an emptyDir too. Dashboards come from ConfigMaps (see sidecar
  # below), so they reload on restart.
  persistence:
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi

  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.localtest.me
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.localtest.me
    annotations:
      cert-manager.io/cluster-issuer: selfsigned

  # The dashboard sidecar loads every ConfigMap labelled
  # grafana_dashboard: "1". The chart's own dashboards use it, and so does
  # the demo chart's canary dashboard (helm/demo/dashboards/canary.json).
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      # Search every namespace, so a chart can ship its dashboard next to
      # its workload instead of in `monitoring`.
      searchNamespace: ALL
