# Wrapper chart for ArgoCD.
#
# Same pattern as infra/argo-rollouts: a Chart.yaml dependency pinning the
# upstream chart, so `helm lint infra/argocd` runs in CI and the bootstrap
# installs it without a separate `helm repo add`.
apiVersion: v2
name: argocd
description: |-
  ArgoCD for the stackup cluster. Runs the GitOps control plane that
  reconciles the app-of-apps tree under argocd/ against this repository.
type: application
version: 0.1.0
appVersion: "3.4.3"
home: https://github.com/ykstorm/stackup
sources:
  - https://github.com/ykstorm/stackup
maintainers:
  - name: ykstorm
dependencies:
  # Pinned, not floated. Bump deliberately and re-run `helm dependency build`.
  - name: argo-cd
    version: 9.5.21
    repository: https://argoproj.github.io/argo-helm
