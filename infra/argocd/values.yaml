# ArgoCD values for the stackup cluster.
#
# Values for the upstream chart are nested under its dependency name
# `argo-cd` (see Chart.yaml).
#
# Kept small: server, repo-server, application-controller and the
# ApplicationSet controller, with an ingress on argocd.localtest.me. TLS is
# terminated at the ingress by cert-manager (the selfsigned ClusterIssuer),
# and the server runs in insecure mode behind it so there is no second TLS
# hop.

argo-cd:
  global:
    # ArgoCD's own URL (`url` in argocd-cm). Without it the chart default,
    # argocd.example.com, ends up there.
    domain: argocd.localtest.me

  # scripts/bootstrap.sh applies the CRDs itself, server-side, from the ArgoCD
  # release that matches this chart's appVersion, before installing it. The
  # ApplicationSet CRD alone is over 1 MB, too large for a client-side apply.
  crds:
    install: false

  configs:
    params:
      # The ingress terminates TLS. Running the server insecure (plain HTTP)
      # behind it avoids the server serving its own self-signed certificate
      # under the ingress one (a redirect loop or handshake mismatch). This
      # is the usual setup for an ArgoCD behind an ingress. It is also why
      # make port-forward uses the Service's port 80 over plain HTTP.
      server.insecure: true

    cm:
      # Report a child Application's health to its parent. ArgoCD stopped
      # assessing Application health by default in 1.8; without this the
      # root's sync waves (argocd/apps) would only order creation, not wait
      # for the previous wave to be Healthy. The script is the one in the
      # ArgoCD documentation.
      resource.customizations.health.argoproj.io_Application: |
        hs = {}
        hs.status = "Progressing"
        hs.message = ""
        if obj.status ~= nil then
          if obj.status.health ~= nil then
            hs.status = obj.status.health.status
            if obj.status.health.message ~= nil then
              hs.message = obj.status.health.message
            end
          end
        end
        return hs

  server:
    # Single replica on a single-node kind cluster.
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

    ingress:
      enabled: true
      ingressClassName: nginx
      # localtest.me resolves to 127.0.0.1, so no hosts-file entry is needed.
      hostname: argocd.localtest.me
      annotations:
        cert-manager.io/cluster-issuer: selfsigned
      tls: true

  # Optional components this cluster does not use.
  dex:
    enabled: false
  notifications:
    enabled: false
