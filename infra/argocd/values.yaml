# ArgoCD values for the stackup cluster.
#
# Values for the upstream chart are nested under its dependency name
# `argo-cd` (see Chart.yaml).
#
# Kept small: server, repo-server, application-controller and the
# ApplicationSet controller, with an ingress on argocd.localtest.me. TLS is
# terminated at the ingress by cert-manager (the selfsigned ClusterIssuer),
# and the server runs in insecure mode behind it so there is no second TLS
# hop.

argo-cd:
  configs:
    params:
      # The ingress terminates TLS. Running the server insecure (plain HTTP)
      # behind it avoids the server serving its own self-signed certificate
      # under the ingress one (a redirect loop or handshake mismatch). This
      # is the usual setup for an ArgoCD behind an ingress.
      server.insecure: true

  server:
    # Single replica on a single-node kind cluster.
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

    ingress:
      enabled: true
      ingressClassName: nginx
      # localtest.me resolves to 127.0.0.1, so no hosts-file entry is needed.
      hostname: argocd.localtest.me
      annotations:
        cert-manager.io/cluster-issuer: selfsigned
      tls: true

  # Optional components this cluster does not use.
  dex:
    enabled: false
  notifications:
    enabled: false
