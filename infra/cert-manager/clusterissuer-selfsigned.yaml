# Self-signed ClusterIssuer for the local kind cluster.
#
# Why self-signed rather than Let's Encrypt (ACME):
#
# - HTTP-01 needs a public DNS name that the ACME challenge server can
#   reach. *.localtest.me resolves to 127.0.0.1 everywhere, so the
#   challenger would connect to its own loopback, never to this cluster.
# - DNS-01 would work but needs a DNS provider account and API token.
# - Self-signed gives a working TLS handshake. Browsers and curl reject
#   the chain by default; `curl -k` or a browser exception covers it.
#
# How it is used: each Ingress carries the annotation
#   cert-manager.io/cluster-issuer: selfsigned
# cert-manager then creates a Certificate for the Ingress's
# tls.secretName and signs it with a fresh key from this issuer. The
# ingress-nginx controller serves the resulting Secret.
#
# Moving to a real domain means replacing `selfSigned: {}` with an `acme:`
# block (DNS-01 solver) and pointing the Ingress annotations at it.
#
# The cert-manager Application (argocd/apps/templates/cert-manager.yaml)
# applies this file next to the chart. Sync-wave 1 holds it back until the
# chart's Deployments are healthy: the cert-manager webhook has to be serving
# before it accepts a ClusterIssuer.

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
  labels:
    app.kubernetes.io/part-of: stackup
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selfSigned: {}
