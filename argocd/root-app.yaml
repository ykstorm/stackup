# The app-of-apps root.
#
# One Application that renders argocd/apps, a small Helm chart in this
# repository whose templates are the child Applications, one per component.
# Reconciling `root` brings in the whole tree. The children carry sync waves,
# and infra/argocd/values.yaml teaches ArgoCD to report a child's health, so
# each wave waits for the previous one to be Healthy.
#
# scripts/bootstrap.sh applies this file. When STACKUP_REPO or
# STACKUP_REVISION is set it replaces the repository URL and `main` below,
# in the source and in the values passed to the children alike.
#
# Automated sync keeps the tree in step with git; prune removes what is
# dropped from git; selfHeal reverts changes made outside git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: stackup
spec:
  project: default
  source:
    repoURL: https://github.com/ykstorm/stackup
    targetRevision: main
    path: argocd/apps
    helm:
      valuesObject:
        repoURL: https://github.com/ykstorm/stackup
        targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
