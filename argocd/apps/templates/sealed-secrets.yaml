# Sealed Secrets: the upstream release manifest for the controller, kept in
# this repository at infra/sealed-secrets/controller.yaml (see the README
# there). It creates the sealed-secrets-controller Deployment and Service in
# kube-system, which is where kubeseal looks by default.
#
# Wave 1 of the root.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: stackup
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: infra/sealed-secrets
    directory:
      include: controller.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    {{- include "stackup.syncPolicy" . | nindent 4 }}
    syncOptions:
      - ServerSideApply=true
