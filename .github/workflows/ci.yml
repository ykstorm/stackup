name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-k8s-tools

      # The same script `make lint` runs locally. LINT_STRICT=1 turns a
      # missing tool into a failure instead of a skipped check.
      - name: make lint
        env:
          LINT_STRICT: "1"
        run: make lint

  demo-app:
    name: Demo app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/demo/package-lock.json
      - name: npm ci and npm test
        working-directory: apps/demo
        run: |
          npm ci
          npm test
      - name: Build the image
        run: docker build -t stackup-demo:ci apps/demo

  build-docs:
    name: Build docs site
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json
      - name: Build static site
        working-directory: docs-site
        run: |
          npm ci
          npm run build
      # Build runs on every push/PR (validates the site). Deploy to gh-pages
      # only on push to the default branch — PRs build but don't publish.
      - uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs-site/out
