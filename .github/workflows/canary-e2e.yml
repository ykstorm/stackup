name: Canary e2e

# Checks the canary claim on a real cluster: kind, Argo Rollouts, a live
# Prometheus and steady traffic. A healthy v2 must advance 25, 50, 75, 100
# because the AnalysisTemplate's Prometheus success-rate query clears the 0.95
# gate; then a canary whose every request fails must be aborted by the same
# gate and leave the healthy revision serving.
#
# Kept out of ci.yml because it is the heavy live-cluster job, so working on
# it does not red the CI badge. It runs on pull requests that touch the paths
# below, so the gate is checked before a change merges, and again on main.
# ci/ holds the CI Prometheus and the traffic pods, which the job applies.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'helm/demo/**'
      - 'apps/demo/**'
      - 'argocd/**'
      - 'kind/**'
      - 'ci/**'
      - '.github/workflows/canary-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'helm/demo/**'
      - 'apps/demo/**'
      - 'argocd/**'
      - 'kind/**'
      - 'ci/**'
      - '.github/workflows/canary-e2e.yml'

env:
  # Keep equal to appVersion in infra/argo-rollouts/Chart.yaml (lint.sh checks).
  ARGO_ROLLOUTS_VERSION: v1.9.0

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: stackup

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      # Same controller version the cluster chart pins (infra/argo-rollouts,
      # appVersion 1.9.0). The job used to apply the "latest" release
      # client-side. Argo Rollouts v1.10.0 was published on 2026-08-27 with
      # CRDs too large for client-side apply's last-applied annotation, and
      # 2026-10-03 was the first run that hit it. Server-side apply below
      # avoids the annotation; the pin keeps a new release from changing this
      # job without a commit.
      - name: Install kubectl-argo-rollouts plugin
        run: |
          curl -sSL -o /tmp/kar https://github.com/argoproj/argo-rollouts/releases/download/${ARGO_ROLLOUTS_VERSION}/kubectl-argo-rollouts-linux-amd64
          chmod +x /tmp/kar && sudo mv /tmp/kar /usr/local/bin/kubectl-argo-rollouts

      - name: Install Argo Rollouts controller
        run: |
          kubectl create namespace argo-rollouts
          kubectl apply --server-side -n argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/download/${ARGO_ROLLOUTS_VERSION}/install.yaml
          kubectl -n argo-rollouts rollout status deploy/argo-rollouts --timeout=180s

      - name: Build demo image v1 and load into kind
        run: |
          docker build -t stackup-demo:v1 apps/demo
          kind load docker-image stackup-demo:v1 --name stackup

      - name: Namespaces + live Prometheus
        run: |
          kubectl create namespace app
          kubectl apply -f ci/prometheus.yaml
          kubectl -n monitoring rollout status deploy/prometheus --timeout=180s

      - name: Install demo (initial revision, canary Rollout)
        run: |
          helm install demo helm/demo -n app \
            -f helm/demo/values.dev.yaml -f helm/demo/values.ci.yaml \
            --set image.tag=v1
          # First rollout of a fresh Rollout goes straight to 100% (no canary
          # steps on initial create) — just wait for Healthy.
          kubectl argo rollouts status demo -n app --timeout 240s

      - name: Start steady traffic
        run: |
          kubectl apply -f ci/traffic.yaml
          kubectl -n app rollout status deploy/traffic --timeout=120s

      - name: Warm the rate() window
        run: |
          echo "Filling the 1m rate() window with real 2xx traffic before the canary analysis runs..."
          sleep 75
          # Sanity: Prometheus should already see a healthy success ratio.
          kubectl -n monitoring exec deploy/prometheus -- \
            wget -qO- 'http://localhost:9090/api/v1/query?query=sum(rate(http_requests_total%7Bservice%3D%22demo%22%2Ccode%3D~%222..%22%7D%5B1m%5D))/sum(rate(http_requests_total%7Bservice%3D%22demo%22%7D%5B1m%5D))' || true

      - name: Ship v2 → drive a real canary through the gate
        run: |
          docker build -t stackup-demo:v2 apps/demo
          kind load docker-image stackup-demo:v2 --name stackup
          helm upgrade demo helm/demo -n app \
            -f helm/demo/values.dev.yaml -f helm/demo/values.ci.yaml \
            --set image.tag=v2
          echo "Watching the canary advance (blocks until Healthy, or non-zero if it aborts)..."
          kubectl argo rollouts status demo -n app --watch --timeout 480s

      - name: Assert canary completed via the analysis gate
        run: |
          set -e
          # jsonpath comes from kubectl against the Rollout CRD; the argo
          # rollouts plugin's `get` is a pretty-view only and rejects -o.
          PHASE=$(kubectl get rollout demo -n app -o jsonpath='{.status.phase}')
          echo "Rollout phase: $PHASE"
          kubectl argo rollouts get rollout demo -n app --no-color | tee /tmp/rollout.txt
          echo "--- AnalysisRuns ---"
          kubectl -n app get analysisrun -o custom-columns=NAME:.metadata.name,PHASE:.status.phase | tee /tmp/analysis.txt
          # The values the gate measured: the canary pods' own success ratio.
          kubectl -n app get analysisrun -o jsonpath='{range .items[*]}{.metadata.name}{" measured "}{.status.metricResults[0].measurements[*].value}{"\n"}{end}' | tee -a /tmp/analysis.txt
          # Gate: the rollout must be Healthy AND at least one AnalysisRun must
          # have Succeeded — that's the real Prometheus success-rate check passing.
          test "$PHASE" = "Healthy"
          kubectl -n app get analysisrun -o jsonpath='{.items[*].status.phase}' | grep -q Successful
          # Remember which ReplicaSet is stable now; the failing canary below
          # must leave it in place.
          echo "STABLE_RS=$(kubectl get rollout demo -n app -o jsonpath='{.status.stableRS}')" >> "$GITHUB_ENV"

      - name: Ship a canary that fails every request; the gate must abort it
        run: |
          # Same v2 image, but FAILURE_RATE=1 makes every /api/work answer 500.
          # The gate measures the canary pod alone, whose only 2xx answers are
          # kubelet probes and Prometheus scrapes, so its success ratio is
          # near 0, under the 0.95 threshold; the analysis fails twice and aborts.
          helm upgrade demo helm/demo -n app             -f helm/demo/values.dev.yaml -f helm/demo/values.ci.yaml             --set image.tag=v2 --set failureRate=1
          echo "Watching the canary; status exits non-zero when the rollout aborts, which is the result we want..."
          if kubectl argo rollouts status demo -n app --watch --timeout 480s; then
            echo "The rollout completed although every canary request failed; the gate did not fire."
            exit 1
          fi

      - name: Assert the failing canary was rolled back
        run: |
          set -e
          PHASE=$(kubectl get rollout demo -n app -o jsonpath='{.status.phase}')
          echo "Rollout phase: $PHASE"
          kubectl argo rollouts get rollout demo -n app --no-color | tee /tmp/rollout-failed.txt
          kubectl -n app get analysisrun -o custom-columns=NAME:.metadata.name,PHASE:.status.phase | tee /tmp/analysis-failed.txt
          kubectl -n app get analysisrun -o jsonpath='{range .items[*]}{.metadata.name}{" measured "}{.status.metricResults[0].measurements[*].value}{"\n"}{end}' | tee -a /tmp/analysis-failed.txt
          test "$PHASE" = "Degraded"
          kubectl -n app get analysisrun -o jsonpath='{.items[*].status.phase}' | grep -q Failed
          # Stable is still the healthy v2 ReplicaSet from the previous step.
          test "$(kubectl get rollout demo -n app -o jsonpath='{.status.stableRS}')" = "$STABLE_RS"
          # The abort scales the canary down, but its pod keeps answering 500s
          # until it is deleted, and for a moment after the abort kube-proxy
          # can still send it a request. Wait until it is gone, so the probe
          # below reaches only the stable pods.
          kubectl -n app wait --for=delete pod --timeout=90s \
            -l "app.kubernetes.io/name=demo,rollouts-pod-template-hash!=$STABLE_RS"
          # And the service answers from it: a sample of requests must succeed.
          kubectl -n app run probe --rm -i --restart=Never --image=curlimages/curl:8.10.1 --             sh -c 'ok=0; for i in $(seq 1 20); do curl -s -o /dev/null -w "%{http_code}" http://demo.app.svc.cluster.local:3000/api/work | grep -q 200 && ok=$((ok+1)); done; echo "$ok/20 ok"; test "$ok" -ge 18'

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-proof
          path: |
            /tmp/rollout.txt
            /tmp/analysis.txt
            /tmp/rollout-failed.txt
            /tmp/analysis-failed.txt
