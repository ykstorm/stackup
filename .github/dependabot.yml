version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # The two wrapper charts pin their upstream chart in Chart.yaml.
  - package-ecosystem: "helm"
    directory: "/infra/argocd"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "helm"
    directory: "/infra/argo-rollouts"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
